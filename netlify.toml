[build]
  command = "echo 'No build step needed'"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.9"
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/overview"
  to = "/.netlify/functions/overview"
  status = 200

[[redirects]]
  from = "/api/positions"
  to = "/.netlify/functions/positions"
  status = 200

[[redirects]]
  from = "/api/signals"
  to = "/.netlify/functions/signals"
  status = 200

[[redirects]]
  from = "/api/trades"
  to = "/.netlify/functions/trades"
  status = 200

[[redirects]]
  from = "/api/strategies"
  to = "/.netlify/functions/strategies"
  status = 200

[[redirects]]
  from = "/api/notes"
  to = "/.netlify/functions/notes"
  status = 200

[[redirects]]
  from = "/api/add_note"
  to = "/.netlify/functions/add_note"
  status = 200

[[redirects]]
  from = "/api/delete_note"
  to = "/.netlify/functions/delete_note"
  status = 200

[[redirects]]
  from = "/api/add_position"
  to = "/.netlify/functions/add_position"
  status = 200

[[redirects]]
  from = "/api/close_position"
  to = "/.netlify/functions/close_position"
  status = 200

[[redirects]]
  from = "/api/watchlist"
  to = "/.netlify/functions/watchlist"
  status = 200

[[redirects]]
  from = "/api/news_alerts"
  to = "/.netlify/functions/news_alerts"
  status = 200

[[redirects]]
  from = "/api/news_alerts/poll"
  to = "/.netlify/functions/news_alerts_poll"
  status = 200

[[redirects]]
  from = "/api/news_alerts/mark_read"
  to = "/.netlify/functions/news_alerts_mark_read"
  status = 200

[[redirects]]
  from = "/api/quote/*"
  to = "/.netlify/functions/quote/:splat"
  status = 200

[[redirects]]
  from = "/api/set_balance"
  to = "/.netlify/functions/set_balance"
  status = 200

[[redirects]]
  from = "/api/run_wheat_bot"
  to = "/.netlify/functions/run_wheat_bot"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
